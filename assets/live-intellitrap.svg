<circle cx="40" cy="44" r="6" fill="#3ddc97"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
<text x="54" y="49" font-size="13" font-weight="700" fill="#3ddc97" letter-spacing="2" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif">LIVE</text>
<text x="32" y="92" font-size="34" font-weight="700" fill="#fff" letter-spacing="-.5" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif">IntelliTrap</text><text x="32" y="118" font-size="18" fill="#8fa0c0" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif">Secure cloud storage that scores every session for</text><text x="32" y="144" font-size="18" fill="#8fa0c0" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif">risk and diverts suspicious ones to decoy data.</text><g transform="translate(32,206)"><rect width="190" height="30" rx="15" fill="#1a2540" stroke="#2a3b66"/><text x="15" y="20" font-size="13" fill="#eaf0ff" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif">RandomForest scoring</text></g><g transform="translate(230,206)"><rect width="190" height="30" rx="15" fill="#1a2540" stroke="#2a3b66"/><text x="15" y="20" font-size="13" fill="#eaf0ff" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif">Admin threat console</text></g><g transform="translate(428,206)"><rect width="246" height="30" rx="15" fill="#1a2540" stroke="#2a3b66"/><text x="15" y="20" font-size="13" fill="#eaf0ff" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif">Supabase row-level security</text></g>
<text x="32" y="276" font-size="14" fill="#4cc2ff" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif">intellitrap-batch-3.vercel.app</text><path d="M780 50 L880 85 V160 C880 215 835 245 780 262 C725 245 680 215 680 160 V85 Z" fill="#121f3a" stroke="#4cc2ff" stroke-width="3"/><circle cx="780" cy="150" r="46" fill="none" stroke="#4cc2ff" stroke-width="2"><animate attributeName="r" values="30;70;30" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0;.8" dur="3s" repeatCount="indefinite"/></circle><rect x="735" y="205" width="90" height="12" rx="6" fill="#1a2540"/><rect x="735" y="205" width="20" height="12" rx="6" fill="#3ddc97"><animate attributeName="width" values="20;88;20" dur="5s" repeatCount="indefinite"/><animate attributeName="fill" values="#3ddc97;#ffb020;#ff5a5f;#3ddc97" dur="5s" repeatCount="indefinite"/></rect><text x="780" y="236" text-anchor="middle" font-size="13" fill="#8fa0c0" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif">session risk</text></g></svg>