<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-label="IntelliTrap, live project">
<defs><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#13294f"/></linearGradient><clipPath id="lc1"><rect width="1000" height="300" rx="22"/></clipPath>
<pattern id="gr1" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1d2c4d" stroke-width="1"/></pattern></defs>
