name: Refresh profile stats
on:
  schedule:
    - cron: "30 1 * * *"   # daily, 07:00 IST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python generate.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "profile-bot"
          git config user.email "profile-bot@users.noreply.github.com"
          git add assets
          if ! git diff --cached --quiet; then git commit -m "Refresh profile stats" && git push; fi
